name: D1 Storage Tests

# Repository-contract tests against a real local D1 database inside the
# Workers runtime (workerd via @cloudflare/vitest-pool-workers). Runs
# fully locally — no Cloudflare credentials involved.
on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  d1-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run D1 contract tests in workerd
        run: npm run test:workers
