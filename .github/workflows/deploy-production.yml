name: Deploy production

# Production reaches Cloudflare only via the merge of a reviewed pull
# request to main. Order matters: tests, build, then D1 migrations, and
# the Worker deploys only if migrations succeed.
on:
  push:
    branches: [main]

concurrency:
  group: asciiweave-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.repository == 'spacecubics/asciiweave'

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install codespell
        run: pip install codespell

      - name: Check spelling
        run: |
          codespell --quiet-level=2 --ignore-words=.codespell-ignore \
            --skip="./package-lock.json,./app/src/preview/asciidoctor.css"

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run the TypeScript compiler
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Run D1 contract tests in workerd
        run: npm run test:workers

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Build the browser app
        run: npm run build

      - name: Migrate production D1 and deploy the production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin to the repository's Wrangler version.
          packageManager: npm
          preCommands: npx wrangler d1 migrations apply DB --remote --env production
          command: deploy --env production --var GIT_COMMIT:${{ github.sha }}

      - name: Production smoke test (non-destructive)
        env:
          ACCESS_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          ACCESS_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          url="https://asciiweave.spacecubics.org"
          for i in $(seq 1 10); do
            body=$(curl -sf \
              -H "CF-Access-Client-Id: $ACCESS_ID" \
              -H "CF-Access-Client-Secret: $ACCESS_SECRET" \
              "$url/api/health") && break
            sleep 3
          done
          echo "health: $body"
          echo "$body" | grep -q '"ok":true'
          echo "$body" | grep -q "${{ github.sha }}"
          echo "Deployed commit ${{ github.sha }} to $url" >> "$GITHUB_STEP_SUMMARY"
