name: Deploy production

# Production deploys after a push to main and can also be started manually
# for a selected ref. Order matters: tests, build, then D1 migrations, and
# the Worker deploys only if migrations succeed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: asciiweave-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'spacecubics/asciiweave'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      smoke-test-url: https://asciiweave.spacecubics.org
      smoke-test-access: true
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
      CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
