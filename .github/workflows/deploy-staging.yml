name: Deploy staging

# Manual staging deployment: apply pending migrations to the staging D1
# database, then deploy the current ref to the asciiweave-staging
# Worker. Runs only from this repository (never for forks — fork pull
# requests cannot see the Cloudflare secrets).
on:
  workflow_dispatch:

concurrency:
  group: asciiweave-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'spacecubics/asciiweave'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
