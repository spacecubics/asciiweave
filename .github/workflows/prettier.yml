name: Prettier

on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Check formatting
        run: npm run format:check
