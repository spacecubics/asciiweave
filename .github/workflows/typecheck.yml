name: Typecheck

on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Run the TypeScript compiler
        run: npm run typecheck
