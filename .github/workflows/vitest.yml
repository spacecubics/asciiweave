name: Unit Tests

on:
  pull_request:
  push:
permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Setup Node.js and install dependencies
        uses: ./.github/actions/setup-node

      - name: Run unit tests
        run: npm test
